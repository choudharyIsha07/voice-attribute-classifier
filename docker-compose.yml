version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Voice Attribute Classifier
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - MAX_UPLOAD_SIZE=10485760          # 10 MB
      - GENDER_PITCH_THRESHOLD_HZ=165.0   # F0 boundary male/female
      - MIN_VOICED_FRAMES_RATIO=0.10
      - INFERENCE_TARGET_SR=16000
    # No volumes — audio is never persisted to disk (privacy guarantee)
    read_only: false    # pydub needs /tmp for format detection fallback
    tmpfs:
      - /tmp:size=64m   # tmpfs for pydub's temp usage — cleared on container restart
